    # ---------------------------------------------------------- Enums --------
    Uom:
      type: string
      description: |
        Unit of measure. The base unit is the SKU's atomic quantity — the only
        unit in which all balance quantities are stored.
      enum: [EACH, Kg, g, m, L, mL]

    LotStatus:
      type: string
      description: |
        Only `AVAILABLE` lots appear in `findReservableBalances`. Changing a lot's
        status stops new allocations but does not remove existing balances.
      enum: [AVAILABLE, QUARANTINED, EXPIRED, RECALLED]

    StorageNodeType:
      type: string
      enum: [WAREHOUSE, ZONE, AISLE, BAY, BIN, PALLET, TOTE, CART]

    MovementReason:
      type: string
      description: |
        Why the stock moved. Constrains what the rest of the row may contain:
        `allocation_id` is only valid for `PICK`, and `BREAK_PACKAGE`/`REPACKAGE`
        model opening a sealed container — the project leg and the destination leg
        are both recorded, giving the ledger its double-entry property.
      enum:
        - RECEIVING
        - PUTAWAY
        - PICK
        - REPLENISHMENT
        - INTERNAL_TRANSFER
        - BREAK_PACKAGE
        - REPACKAGE
        - CYCLE_COUNT
        - SCRAP_DAMAGED
        - RETURN

    OrderStatus:
      type: string
      description: |
        Outbound lifecycle: `PENDING -> ALLOCATED -> PICKING -> PACKED -> SHIPPED`,
        with `PARTIALLY_ALLOCATED` when only some lines were satisfiable and
        `CANCELLED` reachable from any pre-`SHIPPED` state.
      enum: [PENDING, ALLOCATED, PARTIALLY_ALLOCATED, PICKING, PACKED, SHIPPED, CANCELLED]

    InboundOrderStatus:
      type: string
      description: |
        Inbound lifecycle: `DRAFT -> ISSUED -> PARTIALLY_RECEIVED -> RECEIVED`,
        with `CANCELLED` reachable from any pre-`RECEIVED` state.
      enum: [DRAFT, ISSUED, PARTIALLY_RECEIVED, RECEIVED, CANCELLED]

    ReceiptStatus:
      type: string
      enum: [RECEIVING, COMPLETED, CANCELLED]

    ShipmentStatus:
      type: string
      enum: [STAGED, SHIPPED, DELIVERED, CANCELLED]

    TaskType:
      type: string
      enum: [PUTAWAY, PICK, REPLENISH, COUNT, RELOCATE_NODE]

    TaskStatus:
      type: string
      enum: [PENDING, ASSIGNED, IN_PROGRESS, COMPLETED, CANCELLED]