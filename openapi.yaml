      x-handler: InventoryHandler.DeleteAllocation
      responses:
        "204":
          description: Allocation released.
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  # ---------------------------------------------------- Inventory Movements ---
  /api/v1/inventory/movements:
    post:
      tags: [Inventory Movements]
      operationId: insertMovement
      summary: Append a movement to the inventory ledger
      description: |
        `inventory_movements` is an immutable append-only double-entry ledger; there
        is no update or delete endpoint and there never will be. Database
        constraints enforce:

        - `source_node_id` and `destination_node_id` must differ
        - at least one of the two must be non-null
        - `allocation_id` is only permitted when `reason = 'PICK'`
        - `is_sealed` must be consistent with `package_count`
          (`chk_unsealed_no_packages`)

        A single movement row represents **both** legs of a transfer. Pair it with
        `project/source-deduction` and `project/destination-addition` in one
        transaction.
      x-handler: InventoryHandler.InsertMovement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MovementCreate"
      responses:
        "201":
          description: Movement appended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Movement"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

