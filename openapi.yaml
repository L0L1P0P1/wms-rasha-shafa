  /api/v1/inventory/allocations/{id}/picked:
    patch:
      tags: [Inventory Allocations]
      operationId: incrementAllocationPicked
      summary: Report picked quantity against an allocation
      description: |
        Adds `PickedQuantity` to `picked_quantity`, guarded by `chk_picked_le_allocated`
        (`picked + delta <= allocated`). Executing via `:one`, a rejected
        over-pick yields sqlc `ErrNoRows` which surfaces as `500`; it should be
        `409`.
      x-handler: InventoryHandler.IncrementAllocationPicked
      x-handler-gap: |
        The handler binds the body into `IncrementAllocationPickedParams`, which
        includes the `id` field — so today `id` comes from the **body**, not the
        path. Change the handler to set `params.ID` from `PathValue("id")`.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [PickedQuantity]
              properties:
                PickedQuantity:
                  allOf:
                    - $ref: "#/components/schemas/Quantity"
                  description: Quantity picked now, in `base_uom`. Cumulative total must not exceed `allocated_quantity`.
      responses:
        "200":
          description: Allocation updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Allocation"
