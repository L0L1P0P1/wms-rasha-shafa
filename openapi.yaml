      summary: Reserve stock against an outbound order line
      description: |
        Creates the reservation row linking an `outbound_order_lines` row to a
        concrete `inventory_balances` row. **This endpoint does not move stock** —
        it does not touch `inventory_balances.allocated`. To keep the balance
        consistent you must also call
        `PATCH /api/v1/inventory/balances/{id}/allocation` with the same
        `version`, in the same transaction. `(order_line_id, balance_id)` is
        unique.
      x-handler: InventoryHandler.CreateAllocation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AllocationCreate"
