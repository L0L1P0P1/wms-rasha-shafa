        destination, newest first.
      x-handler: InventoryHandler.ListMovementsByNode
      x-handler-gap: |
        The handler sets only `SourceNodeID`, leaving `Limit`/`Offset` at `0`, so
        the SQL `LIMIT 0 OFFSET 0` always returns an **empty array**. Parse
        `limit`/`offset` from the query string as the other list handlers do.
      parameters:
        - $ref: "#/components/parameters/NodeIdPath"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Movements, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Movement"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/inventory/movements/sku/{sku_id}:
    get:
      tags: [Inventory Movements]
      operationId: listMovementsBySku
      summary: List movements of a SKU
      description: Full movement history for one SKU, newest first.
      x-handler: InventoryHandler.ListMovementsBySKU
      x-handler-gap: |
        The handler parses `limit`/`offset` but **never sets `SkuID`**, so it
        filters on `sku_id = 0` and returns nothing. Read the value from
