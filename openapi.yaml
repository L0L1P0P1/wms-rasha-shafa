  /api/v1/inbound-orders/{id}/status:
    patch:
      tags: [Inbound Orders]
      operationId: updateInboundOrderStatus
      summary: Transition an inbound order's status
      description: |
        Guarded by `WHERE id = $1 AND version = $3`. Intended transitions:

        ```
        DRAFT -> ISSUED -> PARTIALLY_RECEIVED -> RECEIVED
                                 |                     |
                                 +------ CANCELLED <----+
        ```

        A `Version` mismatch returns no rows from sqlc, which the handler reports
        as `500`. Surface this as `409 Conflict` and return the current version.
      x-handler: InboundOrderHandler.UpdateInboundOrderStatus
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [Status, Version]
              properties:
                Status:
                  $ref: "#/components/schemas/InboundOrderStatus"
                Version:
                  type: integer
                  format: int32
                  description: The `version` the client last read. Required for optimistic concurrency.
      responses:
        "200":
          description: Status transitioned; `version` incremented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboundOrder"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  # -------------------------------------------------------------- Receipts ---
  /api/v1/inbound-orders/{id}/receipts:
    post:
      tags: [Receipts]
      operationId: createReceipt
      summary: Open a goods receipt against an inbound order
      description: |
        A receipt is the physical event; its lines are what actually increase stock.
        Open with `Status: RECEIVING`, post the lines, then flip to `COMPLETED` —
        which should be the point at which `project/destination-addition` and a
        `RECEIVING` movement are committed.
      x-handler: InboundOrderHandler.CreateReceipt
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceiptCreate"
      responses:
        "201":
          description: Receipt created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Receipt"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/receipts/{id}/lines:
    post:
      tags: [Receipts]
      operationId: createReceiptLine
      summary: Add a line to a receipt
      x-handler: InboundOrderHandler.CreateReceiptLine
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceiptLineCreate"
      responses:
        "201":
          description: Receipt line created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiptLine"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/receipts/{id}/status:
    patch:
      tags: [Receipts]
      operationId: updateReceiptStatus
      summary: Transition a receipt's status
      description: '`RECEIVING -> COMPLETED` or `RECEIVING -> CANCELLED`. No optimistic-concurrency guard on this table.'
      x-handler: InboundOrderHandler.UpdateReceiptStatus
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [Status]
              properties:
                Status:
                  $ref: "#/components/schemas/ReceiptStatus"
      responses:
        "200":
          description: Receipt status updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Receipt"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  # -------------------------------------------------------- Outbound Orders ---
  /api/v1/outbound-orders:
    post:
      tags: [Outbound Orders]
      operationId: createOutboundOrder
      summary: Create an outbound order
      x-handler: OutboundOrderHandler.CreateOutboundOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OutboundOrderCreate"
      responses:
        "201":
          description: Outbound order created with `version = 1`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutboundOrder"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags: [Outbound Orders]
      operationId: listOutboundOrdersByStatus
      summary: List outbound orders by status
      description: Ordered by `priority` descending then `createdAt` ascending — highest priority and oldest first, which is the natural work queue.
      x-handler: OutboundOrderHandler.ListOrdersByStatus
      x-handler-gap: |
        `ListOrdersByStatusParams` requires `Status` (`WHERE status = $1`) but the
        handler only sets `Limit` and `Offset`, so `status` is the empty string and
        the query returns nothing. Make `status` a **required** query parameter
        and parse it into `params.Status`.
      parameters:
        - name: status
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/OrderStatus"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Outbound orders in the requested status.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OutboundOrder"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/outbound-orders/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [Outbound Orders]
      operationId: getOutboundOrderById
      summary: Get an outbound order by id
      x-handler: OutboundOrderHandler.GetOutboundOrderByID
      responses:
        "200":
          description: Outbound order found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutboundOrder"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Outbound Orders]
      operationId: deleteOutboundOrder
      summary: Delete an outbound order
      description: |
        CASCADE removes the order's lines and allocations. Handling units are
        `ON DELETE RESTRICT`, so a packed order cannot be deleted.
      x-handler: OutboundOrderHandler.DeleteOutboundOrder
      responses:
        "204":
          description: Outbound order deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/outbound-orders/by-order-number/{order_number}:
    get:
      tags: [Outbound Orders]
      operationId: getOutboundOrderByNumber
      summary: Get an outbound order by order number
      x-handler: OutboundOrderHandler.GetOutboundOrderByNumber
      parameters:
        - name: order_number
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Outbound order found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutboundOrder"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/outbound-orders/{id}/lines:
    post:
      tags: [Outbound Orders]
      operationId: createOutboundOrderLine
      summary: Add a line to an outbound order
      description: |
        `fulfilled_quantity` is hard-coded to `0`. `(order_id, pku_id)` is unique,
        so the same packaging unit cannot appear twice on one order — order the
        same SKU at two packaging units (e.g. `EACH` and `CASE` of 12) instead.
      x-handler: OutboundOrderHandler.CreateOutboundOrderLine
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OutboundOrderLineCreate"
      responses:
        "201":
          description: Line created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutboundOrderLine"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags: [Outbound Orders]
      operationId: getOutboundOrderLines
      summary: List lines of an outbound order
      x-handler: OutboundOrderHandler.GetOutboundOrderLines
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Outbound order lines with SKU and packaging unit details.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OutboundOrderLineRow"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/outbound-orders/{id}/lines/{line_id}/fulfillment:
    post:
      tags: [Outbound Orders]
      operationId: incrementOrderLineFulfillment
      summary: Report fulfilled quantity against a line
      description: |
        Adds `FulfilledQuantity`, guarded by `chk_fulfillment_bounds`
        (`fulfilled + delta <= requested`). sqlc `:one` returns `ErrNoRows` when
        the guard rejects the write, which the handler surfaces as `500`; it should
        be `409`.
      x-handler: OutboundOrderHandler.IncrementOrderLineFulfillment
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - name: line_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [FulfilledQuantity]
              properties:
                FulfilledQuantity:
                  allOf:
                    - $ref: "#/components/schemas/Quantity"
                  description: Quantity fulfilled in this step, in `base_uom`. Cumulative total must not exceed `requested_quantity`.
      responses:
        "200":
          description: Line updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutboundOrderLine"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/outbound-orders/{id}/status:
    patch:
      tags: [Outbound Orders]
      operationId: updateOutboundOrderStatus
      summary: Transition an outbound order's status
      description: |
        Guarded by `WHERE id = $1 AND version = $3`. Intended transitions:

        ```
        PENDING -> ALLOCATED -> PICKING -> PACKED -> SHIPPED
             |         |         |         |          |
             +---------+---------+---------+---> CANCELLED (any pre-SHIPPED)
        ```

        `PARTIALLY_ALLOCATED` is reachable from `ALLOCATED` when only some lines
        could be satisfied. A `Version` mismatch should be `409`.
      x-handler: OutboundOrderHandler.UpdateOutboundOrderStatus
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [Status, Version]
              properties:
                Status:
                  $ref: "#/components/schemas/OrderStatus"
                Version:
                  type: integer
                  format: int32
                  description: The `version` the client last read. Required for optimistic concurrency.
      responses:
        "200":
          description: Status transitioned; `version` incremented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutboundOrder"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  # -------------------------------------- Handling Units & Shipments --------
  /api/v1/handling-units:
    post:
      tags: [Handling Units & Shipments]
      operationId: createHandlingUnit
      summary: Create a handling unit (pallet / carton / tote)
      description: |
        A handling unit is the **physical, reusable** container that travels with
        the goods — deliberately distinct from a packaging unit, which is a
        consumable/disposable measure of content. `sscc` is the GS1 Serial Shipping
        Container Code.
      x-handler: OutboundOrderHandler.CreateHandlingUnit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HandlingUnitCreate"
      responses:
        "201":
          description: Handling unit created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HandlingUnit"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/handling-units/{handling_unit_id}/contents:
    post:
      tags: [Handling Units & Shipments]
      operationId: packHandlingUnitContent
      summary: Pack an allocation into a handling unit
      x-handler: OutboundOrderHandler.PackHandlingUnitContent
      x-handler-gap: |
        The handler reads `handling_unit_id` from the **request body** rather than
        the path, and discards the returned `HandlingUnitContent`, responding with
        a bare `200`. Read `PathValue("handling_unit_id")` into
        `params.HandlingUnitID` and return `201` with the created row.
      parameters:
        - name: handling_unit_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [AllocationID, PackedQuantity]
              properties:
                AllocationID:
                  type: integer
                  format: int64
                  description: Allocation being packed.
                PackedQuantity:
                  allOf:
                    - $ref: "#/components/schemas/Quantity"
                  description: Quantity placed in this handling unit, in `base_uom`.
      responses:
        "201":
          description: Content packed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HandlingUnitContent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/handling-units/{handling_unit_id}/shipment:
    put:
      tags: [Handling Units & Shipments]
      operationId: assignHandlingUnitToShipment
      summary: Assign a handling unit to a shipment
      description: |
        Sets `shipment_id` and optionally a per-unit `tracking_number`. A shipment
        may contain many handling units, each with its own tracking number under
        a shared `master_tracking_number`.
      x-handler: null
      x-handler-gap: Handler and route missing (`AssignHandlingUnitToShipment` is generated but uncalled). No shipment status transition exists — `shipments.status` can only be set at creation.
      parameters:
        - name: handling_unit_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignShipment"
      responses:
        "200":
          description: Handling unit assigned. No response body.
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/shipments:
    post:
      tags: [Handling Units & Shipments]
      operationId: createShipment
      summary: Create a shipment
      x-handler: OutboundOrderHandler.CreateShipment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShipmentCreate"
      responses:
        "201":
          description: Shipment created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shipment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  # --------------------------------------------------------- Warehouse Tasks --
  /api/v1/tasks:
    post:
      tags: [Warehouse Tasks]
      operationId: createWarehouseTask
      summary: Create a work task for an operator
      description: |
        Tasks are the operator-facing work queue. The whole tasks domain has
        **zero HTTP surface today** — there is no `internal/tasks` package and no
        handler calls any of `CreateWarehouseTask`, `ListPendingTasks`,
        `AssignTask`, `CompleteTask` or `CancelTask`.

        Which fields are meaningful depends on `taskType`:

        | Task type | Populated fields |
        |---|---|
        | `PUTAWAY` | `skuId`, `pkuId`, `lotId`, `packageCount`, `quantity`, `sourceNodeId`, `targetNodeId` |
        | `PICK` | `skuId`, `pkuId`, `lotId`, `quantity`, `sourceNodeId`, `destinationNodeId`, `orderLineId`, `allocationId` |
        | `REPLENISH` | `skuId`, `pkuId`, `quantity`, `sourceNodeId`, `targetNodeId` |
        | `COUNT` | `skuId`, `pkuId`, `lotId`, `targetNodeId` |
        | `RELOCATE_NODE` | `sourceNodeId`, `targetNodeId` |
      x-handler: null
      x-handler-gap: Handler and route missing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WarehouseTaskCreate"
      responses:
        "201":
          description: Task created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarehouseTask"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags: [Warehouse Tasks]
      operationId: listPendingTasks
      summary: List pending work tasks
      description: |
        The dispatch queue: `status = 'PENDING'` ordered by `priority` descending
        then `createdAt` ascending. The query takes a single `limit` with **no
        offset**, so this is a peek at the head of the queue rather than a paginated
        listing.
      x-handler: null
      x-handler-gap: Handler and route missing.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 100
            maximum: 500
      responses:
        "200":
          description: Pending tasks.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WarehouseTask"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/tasks/{id}:
    get:
      tags: [Warehouse Tasks]
      operationId: getWarehouseTaskById
      summary: Get a task by id
      x-handler: null
      x-handler-gap: Handler and route missing.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Task found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarehouseTask"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/tasks/{id}/assign:
    post:
      tags: [Warehouse Tasks]
      operationId: assignTask
      summary: Assign a task to an operator
      description: |
        `PENDING -> ASSIGNED`, guarded by `AND status = 'PENDING'`. The guard makes
        this safe against two dispatchers racing for the same task: the loser gets
        no rows back and should be told `409`.
      x-handler: null
      x-handler-gap: Handler and route missing.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [AssignedOperatorID]
              properties:
                AssignedOperatorID:
                  type: string
      responses:
        "200":
          description: Task assigned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarehouseTask"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/tasks/{id}/complete:
    post:
      tags: [Warehouse Tasks]
      operationId: completeTask
      summary: Complete a task
      description: |
        `ASSIGNED | IN_PROGRESS -> COMPLETED`, stamping `completed_at`. **Nothing
        here writes to the inventory ledger** — completing a `PUTAWAY` task does
        not deduct from the source balance. The task endpoints and the movement
        endpoints must be composed by the caller inside one transaction.
      x-handler: null
      x-handler-gap: Handler and route missing.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Task completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarehouseTask"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/tasks/{id}/cancel:
    post:
      tags: [Warehouse Tasks]
      operationId: cancelTask
      summary: Cancel a task
      description: Any status except `COMPLETED` may be cancelled.
      x-handler: null
      x-handler-gap: Handler and route missing.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Task cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarehouseTask"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      description: Primary key.
      schema:
        type: integer
        format: int64

    LuhnIdPath:
      name: id
      in: path
      required: true
      description: 'Luhn-encoded SKU id (`internal_id * 10 + check_digit`). Rejected with 400 when the check digit does not verify.'
      schema:
        type: integer
        format: int64
        example: 100000

    SkuIdPath:
      name: sku_id
      in: path
      required: true
      description: 'Luhn-encoded SKU id (`internal_id * 10 + check_digit`). Rejected with 400 when the check digit does not verify.'
      schema:
        type: integer
        format: int64
        example: 100000

    NodeIdPath:
      name: node_id
      in: path
      required: true
      schema:
        type: integer
        format: int64

    Limit:
      name: limit
      in: query
      required: false
      description: Maximum rows. Invalid values are logged and replaced with the default.
      schema:
        type: integer
        format: int32
        default: 100
        maximum: 500

    Offset:
      name: offset
      in: query
      required: false
      description: Rows to skip. Invalid values are logged and replaced with the default.
      schema:
        type: integer
        format: int32
        default: 0
        minimum: 0

  responses:
    BadRequest:
      description: |
        Malformed request: unparseable JSON, a non-numeric path parameter, or a
        path parameter that fails the Luhn checksum.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: 'invalid sku id: must be numeric and satisfy luhn checksum'

    NotFound:
      description: No row matched the supplied identifier.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: 'no rows in result set'

    InternalError:
      description: |
        The database call failed. Also returned — incorrectly — for
        optimistic-concurrency version mismatches and for constraint violations
        raised by the ledger's guard checks, all of which should be `409` or `422`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: 'ERROR: new row violates check constraint "chk_picked_le_allocated"'

  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: The raw Go/Postgres error string. Not yet structured or localised.
      example:
        message: not found

    Quantity:
      description: |
        A PostgreSQL `NUMERIC` bound as `pgtype.Numeric`. Serialises as a bare JSON
        number (`12.500`); accepts a number, a quoted string, or `null` on input.
        **Always in the SKU's `base_uom`.**
      oneOf:
        - type: number
        - type: string
      example: 12.5

    NullableQuantity:
      description: |
        A `pgtype.Numeric` that may be SQL NULL — used by the partial-update
        request bodies, where an omitted or `null` field means "leave this column
        alone" (`COALESCE` in the SQL).

        `pgtype.Numeric.UnmarshalJSON` accepts `null`, a bare JSON number, or a
        quoted string; the quoted string is declared here because it is the
        unambiguous form for a client that may legitimately send `null`.
      type: string
      nullable: true
      example: null

    # ------------------------------------------------------------- SKUs ------
    SKU:
      type: object
      required: [ID, Name, BaseUom, IsDiscrete, RequiresLotTracking]
      properties:
        ID:
          type: integer
          format: int64
          description: Luhn-encoded id — `internal_id * 10 + check_digit`. Starts at `100000`.
          example: 100000
        Name:
          type: string
        BaseUom:
          $ref: "#/components/schemas/Uom"
        IsDiscrete:
          type: boolean
          description: True for countable goods (`EACH`), false for continuous materials.
        RequiresLotTracking:
          type: boolean
          description: True when the SKU must carry a lot (expiry, batch, recall).
        TenantID:
          type: integer
          format: int64
          nullable: true
          description: Reserved for multi-tenancy. Never written or filtered on by the current code.
        Attributes:
          type: string
          nullable: true
          description: Free-form JSONB blob, base64-encoded because it is bound as `[]byte`.
          example: eyJjb2xvciI6InJlZCJ9
        CreatedAt:
          type: string
          format: date-time

    SKUCreate:
      type: object
      required: [Name, BaseUom, IsDiscrete, RequiresLotTracking]
      properties:
        Name:
          type: string
          example: M8 Hex Bolt
        BaseUom:
          $ref: "#/components/schemas/Uom"
        IsDiscrete:
          type: boolean
          example: true
        RequiresLotTracking:
          type: boolean
          example: false
        Attributes:
          type: string
          nullable: true
          description: Free-form JSONB as a string, base64-decoded by `encoding/json` into `[]byte`.

    SKUUpdate:
      type: object
      description: All fields optional. Send `null`/omit to leave a column unchanged (`COALESCE`).
      properties:
        Name:
          type: string
          nullable: true
        IsDiscrete:
          type: boolean
          nullable: true
        RequiresLotTracking:
          type: boolean
          nullable: true
        Attributes:
          type: string
          nullable: true

    # -------------------------------------------------- Packaging units -----
    PackagingUnit:
      type: object
      required: [ID, SkuID, UnitName, IsBaseUnit, AllowsBreakBulk]
      properties:
        ID:
          type: integer
          format: int64
        SkuID:
          type: integer
          format: int64
          description: Luhn-encoded.
        UnitName:
          type: string
          example: CASE
        ConversionFactor:
          allOf:
            - $ref: "#/components/schemas/Quantity"
          description: How many `base_uom` units one container holds. Must be exactly `1.0000` when `IsBaseUnit` is true.
        ParentPackagingUnitID:
          type: integer
          format: int64
          nullable: true
          description: Self-referencing FK — builds the `EACH -> CASE -> PALLET` hierarchy.
        IsBaseUnit:
          type: boolean
          description: True for the `base_uom` container. A SKU may have at most one.
        AllowsBreakBulk:
          type: boolean
          description: True when this container may be opened (`BREAK_PACKAGE`) to fulfil part of an order.
        Barcode:
          type: string
          nullable: true
          description: Globally unique across all packaging units.
        TareWeightKg:
          allOf:
            - $ref: "#/components/schemas/Quantity"
          description: Empty-container weight.
        GrossVolumeCm3:
          allOf:
            - $ref: "#/components/schemas/Quantity"
          description: Capacity of the empty container.

    PackagingUnitCreate:
      type: object
      required: [SkuID, UnitName, ConversionFactor]
      properties:
        SkuID:
          type: integer
          format: int64
          description: Luhn-encoded SKU id. The handler validates and strips the check digit.
        UnitName:
          type: string
        ConversionFactor:
          $ref: "#/components/schemas/Quantity"
        ParentPackagingUnitID:
          type: integer
          format: int64
          nullable: true
        IsBaseUnit:
          type: boolean
          default: false
        AllowsBreakBulk:
          type: boolean
          default: false
        Barcode:
          type: string
          nullable: true
        TareWeightKg:
          $ref: "#/components/schemas/Quantity"
        GrossVolumeCm3:
          $ref: "#/components/schemas/Quantity"

    PackagingUnitUpdate:
      type: object
      description: All fields optional (`COALESCE`). `SkuID`, `ParentPackagingUnitID` and `IsBaseUnit` are not editable.
      properties:
        UnitName:
          type: string
          nullable: true
        ConversionFactor:
          $ref: "#/components/schemas/NullableQuantity"
        AllowsBreakBulk:
          type: boolean
          nullable: true
        Barcode:
          type: string
          nullable: true
        TareWeightKg:
          $ref: "#/components/schemas/NullableQuantity"
        GrossVolumeCm3:
          $ref: "#/components/schemas/NullableQuantity"

    # -------------------------------------------------------------- Lots -----
    Lot:
      type: object
      required: [ID, SkuID, LotNumber, Status]
      properties:
        ID:
          type: integer
          format: int64
        SkuID:
          type: integer
          format: int64
          description: Luhn-encoded.
        LotNumber:
          type: string
          example: L-2026-0412
        Status:
          $ref: "#/components/schemas/LotStatus"
        ManufacturedAt:
          type: string
          format: date
          nullable: true
        ExpiresAt:
          type: string
          format: date
          nullable: true
          description: Drives FEFO ordering in `ListLotsBySKU` and `FindReservableBalances`.
        ReceivedAt:
          type: string
          format: date-time

    LotCreate:
      type: object
      required: [SkuID, LotNumber]
      properties:
        SkuID:
          type: integer
          format: int64
          description: Luhn-encoded.
        LotNumber:
          type: string
        Status:
          allOf:
            - $ref: "#/components/schemas/LotStatus"
          default: AVAILABLE
        ManufacturedAt:
          type: string
          format: date
          nullable: true
        ExpiresAt:
          type: string
          format: date
          nullable: true

    # ----------------------------------------------------- Storage nodes -----
    StorageNode:
      type: object
      required: [ID, Code, NodeType, IsMovable, IsActive]
      properties:
        ID:
          type: integer
          format: int64
        ParentID:
          type: integer
          format: int64
          nullable: true
          description: Null for top-level nodes.
        Path:
          type: string
          description: |
            Materialised `ltree` path, e.g. `1.4.19`. Derived by the server on
            create and rewritten wholesale on reparent. Not writable by clients.
          example: 1.4.19
        Code:
          type: string
          description: Unique across all nodes.
          example: BIN-A12-03
        NodeType:
          $ref: "#/components/schemas/StorageNodeType"
        IsMovable:
          type: boolean
          description: False pins a node (e.g. a receiving dock) against relocation.
        MaxWeightKg:
          $ref: "#/components/schemas/NullableQuantity"
        MaxVolumeCm3:
          $ref: "#/components/schemas/NullableQuantity"
        IsActive:
          type: boolean
        CreatedAt:
          type: string
          format: date-time

    StorageNodeCreate:
      type: object
      required: [Code, NodeType]
      properties:
        ParentID:
          type: integer
          format: int64
          nullable: true
          description: Omit to create a top-level node.
        Code:
          type: string
        NodeType:
          $ref: "#/components/schemas/StorageNodeType"
        IsMovable:
          type: boolean
          default: true
        MaxWeightKg:
          $ref: "#/components/schemas/Quantity"
        MaxVolumeCm3:
          $ref: "#/components/schemas/Quantity"
        IsActive:
          type: boolean
          default: true

    StorageNodeUpdate:
      type: object
      description: All fields optional (`COALESCE`). Does not include `parentId`, `nodeType` or `path`.
      properties:
        Code:
          type: string
          nullable: true
        IsMovable:
          type: boolean
          nullable: true
        MaxWeightKg:
          $ref: "#/components/schemas/NullableQuantity"
        MaxVolumeCm3:
          $ref: "#/components/schemas/NullableQuantity"
        IsActive:
          type: boolean
          nullable: true

    NodeRelocation:
      type: object
      properties:
        ID:
          type: integer
          format: int64
        NodeID:
          type: integer
          format: int64
        FromParentID:
          type: integer
          format: int64
          nullable: true
        ToParentID:
          type: integer
          format: int64
          nullable: true
        FromPath:
          type: string
          example: '1.4'
        ToPath:
          type: string
          example: '1.9'
        OperatorID:
          type: string
        CreatedAt:
          type: string
          format: date-time

    NodeRelocationCreate:
      type: object
      required: [FromParentID, ToParentID, FromPath, ToPath, OperatorID]
      properties:
        FromParentID:
          type: integer
          format: int64
          nullable: true
        ToParentID:
          type: integer
          format: int64
          nullable: true
        FromPath:
          type: string
        ToPath:
          type: string
        OperatorID:
          type: string

    # ---------------------------------------------------- Inventory ---------
    InventoryBalance:
      type: object
      required: [ID, NodeID, SkuID, PkuID, IsSealed, Version]
      description: |
        One stock position: a single `(node, sku, packaging unit, lot, sealed)` tuple.
        Uniqueness is enforced on `(node_id, pku_id, lot_id, is_sealed)` with
        `NULLS NOT DISTINCT`, and the table runs at `fillfactor = 70` for the
        hot `version` counter.
      properties:
        ID:
          type: integer
          format: int64
        NodeID:
          type: integer
          format: int64
        SkuID:
          type: integer
          format: int64
          description: Raw database id, **not** Luhn-encoded on this endpoint.
        PkuID:
          type: integer
          format: int64
        LotID:
          type: integer
          format: int64
          nullable: true
        IsSealed:
          type: boolean
          description: True when the stock is contained in an intact, countable package.
        PackageCount:
          allOf:
            - $ref: "#/components/schemas/Quantity"
          description: Container count. Constrained to `0` when `IsSealed` is false.
        Version:
          type: integer
          format: int32
          description: Optimistic-concurrency token. Send this back on every mutation.
        OnHand:
          allOf:
            - $ref: "#/components/schemas/Quantity"
          description: Physical quantity present, in `base_uom`. Must be positive when the row exists.
        Allocated:
          allOf:
            - $ref: "#/components/schemas/Quantity"
          description: Reserved for outbound orders, in `base_uom`. `Allocated <= OnHand` is enforced.
        UpdatedAt:
          type: string
          format: date-time

    BalanceByNode:
      allOf:
        - $ref: "#/components/schemas/InventoryBalance"
        - type: object
          description: '`ListBalancesByNode` join projection.'
          properties:
            SkuUuid:
              type: integer
              format: int64
              description: Denormalised copy of the SKU id.
            SkuName:
              type: string
            UnitName:
              type: string
              description: Denormalised packaging-unit name.

    BalanceLock:
      type: object
      description: Narrow projection returned by `SELECT ... FOR UPDATE`.
      required: [ID, Version]
      properties:
        ID:
          type: integer
          format: int64
        OnHand:
          $ref: "#/components/schemas/Quantity"
        PackageCount:
          $ref: "#/components/schemas/Quantity"
        Allocated:
          $ref: "#/components/schemas/Quantity"
        Version:
          type: integer
          format: int32

    BalanceLockRequest:
      type: object
      required: [NodeID, PkuID, IsSealed]
      properties:
        NodeID:
          type: integer
          format: int64
        PkuID:
          type: integer
          format: int64
        LotID:
          type: integer
          format: int64
          nullable: true
          description: |
            Must be sent explicitly. The query uses
            `lot_id IS NOT DISTINCT FROM $3`, so `null` matches only balances with
            **no** lot and will not match lot-tracked stock.
        IsSealed:
          type: boolean

    BalanceAllocationUpdate:
      type: object
      required: [Allocated, Version]
      properties:
        Allocated:
          allOf:
            - $ref: "#/components/schemas/Quantity"
          description: Delta to add to the reserved quantity. May be negative to release a reservation.
        Version:
          type: integer
          format: int32
          description: Expected `version`. The update is rejected if stale or if it would over-allocate.

    DestinationAddition:
      type: object
      required: [NodeID, SkuID, PkuID, IsSealed, OnHand]
      properties:
        NodeID:
          type: integer
          format: int64
        SkuID:
          type: integer
          format: int64
        PkuID:
          type: integer
          format: int64
        LotID:
          type: integer
          format: int64
          nullable: true
        IsSealed:
          type: boolean
        OnHand:
          allOf:
            - $ref: "#/components/schemas/Quantity"
          description: Quantity to add, in `base_uom`.
        PackageCount:
          $ref: "#/components/schemas/Quantity"

    SourceDeduction:
      type: object
      required: [OnHand, ID, Version]
      properties:
        OnHand:
          allOf:
            - $ref: "#/components/schemas/Quantity"
          description: Quantity to subtract, in `base_uom`.
        PackageCount:
          $ref: "#/components/schemas/Quantity"
        ID:
          type: integer
          format: int64
          description: Balance row id.
        Version:
          type: integer
          format: int32
          description: Expected `version`.

    # --------------------------------------------------- Allocations ---------
    Allocation:
      type: object
      required: [ID, OrderLineID, BalanceID, SkuID]
      description: Reservation of a slice of one balance against one outbound order line.
      properties:
        ID:
          type: integer
          format: int64
        OrderLineID:
          type: integer
          format: int64
          description: '`outbound_order_lines.id`.'
        BalanceID:
          type: integer
          format: int64
          description: '`inventory_balances.id`. `(OrderLineID, BalanceID)` is unique.'
        SkuID:
          type: integer
          format: int64
        AllocatedQuantity:
          allOf:
            - $ref: "#/components/schemas/Quantity"
          description: Reserved quantity, in `base_uom`.
        PickedQuantity:
          allOf:
            - $ref: "#/components/schemas/Quantity"
          description: Quantity actually picked so far. Constrained `<= AllocatedQuantity`.
        CreatedAt:
          type: string
          format: date-time

    AllocationCreate:
      type: object
      required: [OrderLineID, BalanceID, SkuID, AllocatedQuantity]
      properties:
        OrderLineID:
          type: integer
          format: int64
        BalanceID:
          type: integer
          format: int64
          description: Take from `findReservableBalances`.
        SkuID:
          type: integer
          format: int64
        AllocatedQuantity:
          allOf:
            - $ref: "#/components/schemas/Quantity"
          description: Quantity to reserve, in `base_uom`.

    # ------------------------------------------------------ Movements --------
    Movement:
      type: object
      required: [ID, SkuID, PkuID, Reason, IsSealed]
      description: |
        One row of the immutable double-entry inventory ledger. There is no update
        or delete; corrections are made by appending a compensating movement.
      properties:
        ID:
          type: integer
          format: int64
        SkuID:
          type: integer
          format: int64
        PkuID:
          type: integer
          format: int64
        LotID:
          type: integer
          format: int64
          nullable: true
        PackageCount:
          $ref: "#/components/schemas/Quantity"
        Quantity:
          allOf:
            - $ref: "#/components/schemas/Quantity"
          description: Moved quantity in `base_uom`.
        SourceNodeID:
          type: integer
          format: int64
          nullable: true
          description: Null for inbound-only legs (e.g. `RECEIVING`). Paired-leg semantics are the client's job.
        DestinationNodeID:
          type: integer
          format: int64
          nullable: true
          description: Null for outbound-only legs. Must differ from `SourceNodeID`.
        Reason:
          $ref: "#/components/schemas/MovementReason"
        ReferenceID:
          type: string
          nullable: true
          description: Free-form pointer to the driving document (receipt id, task id, allocation id).
        AllocationID:
          type: integer
          format: int64
          nullable: true
          description: Only permitted when `Reason` is `PICK`.
        IsSealed:
          type: boolean
        OperatorID:
          type: string
        CreatedAt:
          type: string
          format: date-time

    MovementCreate:
      type: object
      required: [SkuID, PkuID, Quantity, Reason, OperatorID]
      properties:
        SkuID:
          type: integer
          format: int64
        PkuID:
          type: integer
          format: int64
        LotID:
          type: integer
          format: int64
          nullable: true
        PackageCount:
          $ref: "#/components/schemas/Quantity"
        Quantity:
          allOf:
            - $ref: "#/components/schemas/Quantity"
          description: Quantity moved, in `base_uom`.
        SourceNodeID:
          type: integer
          format: int64
          nullable: true
        DestinationNodeID:
          type: integer
          format: int64
          nullable: true
        Reason:
          $ref: "#/components/schemas/MovementReason"
        ReferenceID:
          type: string
          nullable: true
        AllocationID:
          type: integer
          format: int64
          nullable: true
          description: Only when `Reason` is `PICK`.
        IsSealed:
          type: boolean
          default: false
        OperatorID:
          type: string

    # ---------------------------------------------------- Inbound orders -----
    InboundOrder:
      type: object
      required: [ID, PoNumber, VendorName, Version, Status]
      properties:
        ID:
          type: integer
          format: int64
        PoNumber:
          type: string
          example: PO-88213
        TenantID:
          type: integer
          format: int64
          nullable: true
        VendorName:
          type: string
        Version:
          type: integer
          format: int32
          description: Optimistic-concurrency token. Echo back on every status change.
        Status:
          $ref: "#/components/schemas/InboundOrderStatus"
        ExpectedDelivery:
          type: string
          format: date
          nullable: true
        CreatedAt:
          type: string
          format: date-time
        UpdatedAt:
          type: string
          format: date-time

    InboundOrderCreate:
      type: object
      required: [PoNumber, VendorName]
      properties:
        PoNumber:
          type: string
        VendorName:
          type: string
        Status:
          allOf:
            - $ref: "#/components/schemas/InboundOrderStatus"
          default: DRAFT
        ExpectedDelivery:
          type: string
          format: date
          nullable: true

    InboundOrderLine:
      type: object
      required: [ID, InboundOrderID, SkuID, PkuID]
      properties:
        ID:
          type: integer
          format: int64
        InboundOrderID:
          type: integer
          format: int64
        SkuID:
          type: integer
          format: int64
        PkuID:
          type: integer
          format: int64
          description: Composite FK `(pku_id, sku_id)` — cannot reference another SKU's packaging unit.
        ExpectedQuantity:
          allOf:
            - $ref: "#/components/schemas/Quantity"
          description: Expected in `base_uom`.
        ReceivedQuantity:
          allOf:
            - $ref: "#/components/schemas/Quantity"
          description: Cumulative received, in `base_uom`. Initialised to `0` by the query.

    InboundOrderLineCreate:
      type: object
      required: [InboundOrderID, SkuID, PkuID, ExpectedQuantity]
      properties:
        InboundOrderID:
          type: integer
          format: int64
        SkuID:
          type: integer
          format: int64
        PkuID:
          type: integer
          format: int64
        ExpectedQuantity:
          allOf:
            - $ref: "#/components/schemas/Quantity"
          description: Expected quantity in `base_uom`.

    InboundOrderLineRow:
      allOf:
        - $ref: "#/components/schemas/InboundOrderLine"
        - type: object
          description: '`GetInboundOrderLines` join projection.'
          properties:
            SkuUuid:
              type: integer
              format: int64
            SkuName:
              type: string
            UnitName:
              type: string

    # --------------------------------------------------------- Receipts -----
    Receipt:
      type: object
      required: [ID, InboundOrderID, ReceiptNumber, Status]
      properties:
        ID:
          type: integer
          format: int64
        InboundOrderID:
          type: integer
          format: int64
        ReceiptNumber:
          type: string
        Status:
          $ref: "#/components/schemas/ReceiptStatus"
        OperatorID:
          type: string
        ReceivedAt:
          type: string
          format: date-time

    ReceiptCreate:
      type: object
      required: [InboundOrderID, ReceiptNumber, OperatorID]
      properties:
        InboundOrderID:
          type: integer
          format: int64
        ReceiptNumber:
          type: string
        Status:
          allOf:
            - $ref: "#/components/schemas/ReceiptStatus"
          default: RECEIVING
        OperatorID:
          type: string

    ReceiptLine:
      type: object
      required: [ID, ReceiptID, SkuID, PkuID]
      properties:
        ID:
          type: integer
          format: int64
        ReceiptID:
          type: integer
          format: int64
        InboundOrderLineID:
          type: integer
          format: int64
          nullable: true
          description: Links the receipt back to the expected line; null when receiving an unexpected SKU.
        SkuID:
          type: integer
          format: int64
        PkuID:
          type: integer
          format: int64
        LotID:
          type: integer
          format: int64
          nullable: true
          description: Created or matched during receipt when the SKU is lot-tracked.
        ReceivedQuantity:
          $ref: "#/components/schemas/Quantity"
        PackageCount:
          $ref: "#/components/schemas/Quantity"

    ReceiptLineCreate:
      type: object
      required: [ReceiptID, SkuID, PkuID, ReceivedQuantity]
      properties:
        ReceiptID:
          type: integer
          format: int64
        InboundOrderLineID:
          type: integer
          format: int64
          nullable: true
        SkuID:
          type: integer
          format: int64
        PkuID:
          type: integer
          format: int64
        LotID:
          type: integer
          format: int64
          nullable: true
        ReceivedQuantity:
          allOf:
            - $ref: "#/components/schemas/Quantity"
          description: Quantity received on this line, in `base_uom`.
        PackageCount:
          $ref: "#/components/schemas/Quantity"

    # --------------------------------------------------- Outbound orders ----
    OutboundOrder:
      type: object
      required: [ID, OrderNumber, Version, Status, Priority]
      properties:
        ID:
          type: integer
          format: int64
        TenantID:
          type: integer
          format: int64
          nullable: true
        OrderNumber:
          type: string
          example: SO-2026-0042
        Version:
          type: integer
          format: int32
          description: Optimistic-concurrency token. Echo back on every status change.
        CustomerName:
          type: string
          nullable: true
        Status:
          $ref: "#/components/schemas/OrderStatus"
        Priority:
          type: integer
          format: int32
          description: Higher is dispatched first.
          example: 5
        CreatedAt:
          type: string
          format: date-time
        UpdatedAt:
          type: string
          format: date-time

    OutboundOrderCreate:
      type: object
      required: [OrderNumber]
      properties:
        OrderNumber:
          type: string
        CustomerName:
          type: string
          nullable: true
        Status:
          allOf:
            - $ref: "#/components/schemas/OrderStatus"
          default: PENDING
        Priority:
          type: integer
          format: int32
          default: 0

    OutboundOrderLine:
      type: object
      required: [ID, OrderID, SkuID, PkuID]
      properties:
        ID:
          type: integer
          format: int64
        OrderID:
          type: integer
          format: int64
        SkuID:
          type: integer
          format: int64
        PkuID:
          type: integer
          format: int64
        RequestedQuantity:
          allOf:
            - $ref: "#/components/schemas/Quantity"
          description: Requested in `base_uom`.
        FulfilledQuantity:
          allOf:
            - $ref: "#/components/schemas/Quantity"
          description: Cumulative fulfilled, in `base_uom`. Constrained `<= RequestedQuantity`.

    OutboundOrderLineCreate:
      type: object
      required: [OrderID, SkuID, PkuID, RequestedQuantity]
      properties:
        OrderID:
          type: integer
          format: int64
        SkuID:
          type: integer
          format: int64
        PkuID:
          type: integer
          format: int64
        RequestedQuantity:
          allOf:
            - $ref: "#/components/schemas/Quantity"
          description: Quantity requested in `base_uom`. `(order_id, pku_id)` is unique.

    OutboundOrderLineRow:
      allOf:
        - $ref: "#/components/schemas/OutboundOrderLine"
        - type: object
          description: '`GetOutboundOrderLines` join projection.'
          properties:
            SkuUuid:
              type: integer
              format: int64
            SkuName:
              type: string
            UnitName:
              type: string

    # ------------------------------------------- Handling units/shipments ----
    HandlingUnit:
      type: object
      required: [ID, OutboundOrderID]
      description: |
        A physical, reusable container (pallet, carton, tote). Distinct from a
        packaging unit, which measures content. A handling unit can be packed,
        staged and shipped repeatedly; packaging units are consumed.
      properties:
        ID:
          type: integer
          format: int64
        OutboundOrderID:
          type: integer
          format: int64
        ShipmentID:
          type: integer
          format: int64
          nullable: true
        Sscc:
          type: string
          nullable: true
          description: GS1 Serial Shipping Container Code.
        TrackingNumber:
          type: string
          nullable: true
        TareWeightKg:
          allOf:
            - $ref: "#/components/schemas/Quantity"
          description: Weight of the empty unit.
        GrossWeightKg:
          allOf:
            - $ref: "#/components/schemas/Quantity"
          description: Unit plus contents.
        CreatedAt:
          type: string
          format: date-time

    HandlingUnitCreate:
      type: object
      required: [OutboundOrderID]
      properties:
        OutboundOrderID:
          type: integer
          format: int64
        Sscc:
          type: string
          nullable: true
        TareWeightKg:
          $ref: "#/components/schemas/Quantity"
        GrossWeightKg:
          $ref: "#/components/schemas/Quantity"

    HandlingUnitContent:
      type: object
      required: [ID, HandlingUnitID, AllocationID]
      properties:
        ID:
          type: integer
          format: int64
        HandlingUnitID:
          type: integer
          format: int64
        AllocationID:
          type: integer
          format: int64
          description: '`inventory_allocations.id` — packing references the reservation, not the balance.'
        PackedQuantity:
          allOf:
            - $ref: "#/components/schemas/Quantity"
          description: Quantity packed into this unit, in `base_uom`.

    AssignShipment:
      type: object
      required: [ShipmentID]
      properties:
        ShipmentID:
          type: integer
          format: int64
        TrackingNumber:
          type: string
          nullable: true

    Shipment:
      type: object
      required: [ID, ShipmentNumber, CarrierName, Status]
      properties:
        ID:
          type: integer
          format: int64
        ShipmentNumber:
          type: string
        CarrierName:
          type: string
        MasterTrackingNumber:
          type: string
          nullable: true
        Status:
          $ref: "#/components/schemas/ShipmentStatus"
        ShippedAt:
          type: string
          format: date-time
          nullable: true
        CreatedAt:
          type: string
          format: date-time

    ShipmentCreate:
      type: object
      required: [ShipmentNumber, CarrierName]
      properties:
        ShipmentNumber:
          type: string
        CarrierName:
          type: string
        MasterTrackingNumber:
          type: string
          nullable: true
        Status:
          allOf:
            - $ref: "#/components/schemas/ShipmentStatus"
          default: STAGED
      x-handler-gap: >-
        There is no `UpdateShipmentStatus` query, so a shipment can never be moved
        to `SHIPPED` or `DELIVERED`, and `shipped_at` is never set. Add the SQL and
        handler.

