openapi: 3.0.3

info:
  title: Rasha Shafa WMS API
  version: 1.0.0
  description: |
    Warehouse Management System (WMS) core engine.

    This document describes the **full HTTP surface** of the API, including the
    endpoints that are routed today and the endpoints that still need handlers or
    route registration. Use the `x-handler` / `x-handler-gap` extensions to
    prioritise implementation work.

    ## Conventions

    ### JSON field naming
    Handlers bind request bodies directly into the sqlc-generated `*Params` structs
    via `shared.ReadJSON`, and those structs carry **no `json` tags**. Until a DTO
    layer is introduced, request and response keys are therefore **Go field names
    in PascalCase** (`PoNumber`, `ExpectedQuantity`, `IsSealed`).

    ### Quantity encoding
    `NUMERIC` columns are bound as `pgtype.Numeric`, which marshals as a bare JSON
    number (`12.500`) and accepts a number, a quoted string, or `null` on input.

    ### Luhn-encoded SKU identifiers
    SKU ids are exposed on the wire with a trailing Luhn check digit:

        external_id = (internal_id * 10) + luhn_check_digit(internal_id)

    `stock_keeping_units.id` starts at `10000`. Handlers strip the check digit
    (`id / 10`) before querying and re-append it before responding. **Any id you
    receive for a SKU, packaging unit reference, or lot reference must be the
    encoded form**, otherwise the handler rejects it with
    `invalid sku id: must be numeric and satisfy luhn checksum`.

    ### Dual-unit balance rule
    `on_hand`, `allocated`, `allocated_quantity`, `picked_quantity`,
    `fulfilled_quantity` and `received_quantity` are **always expressed in the
    SKU's atomic `base_uom`**, never in packaging units. `package_count` counts
    physical containers and is only meaningful when `is_sealed` is `true`
    (enforced by `chk_unsealed_no_packages`).

    ### Optimistic concurrency
    `inbound_orders`, `outbound_orders` and `inventory_balances` carry a `version`
    column. Every status/quantity mutation is conditional on `WHERE version = $n`
    and bumps the version. A mismatch yields `no rows` from sqlc, which the
    handler surfaces as **500** today — treat a failure here as **409 Conflict**.

    ### Error envelope
    `shared.ErrorJSON` emits exactly one key:

        {"message": "<err.Error()>"}

    | Status | Meaning in the current handlers |
    |--------|----------------------------------|
    | 400 | Malformed JSON, non-numeric path param, failed Luhn check |
    | 404 | `GetSKU`, `GetInboundOrderByID`, `GetInboundOrderByPONumber`, `GetOutboundOrderByID`, `GetOutboundOrderByNumber`, `GetStorageNode`, `GetStorageNodeByCode` |
    | 500 | Every database error, including optimistic-concurrency misses |

    ### Pagination
    Handlers accept `limit` (default `100`) and `offset` (default `0`) as query
    parameters and return a **bare JSON array** — there is no envelope and no
    total count. Invalid values are logged and silently replaced with the defaults.

    ### Route resolution
    A few collections mix literal and wildcard segments at the same position
    (e.g. `/api/v1/inbound-orders/{id}/status` alongside
    `/api/v1/inbound-orders/by-po-number/{po_number}`). Go 1.22+ `ServeMux`
    resolves this deterministically — the literal segment always wins over the
    wildcard — so `by-po-number` is never captured as an `{id}`. Linters that
    assume a JSON-Schema-style router will flag these as ambiguous; they are not.

    ### Authentication
    Not implemented. `middleware.Logging` (request id + `slog`) is the only
    middleware and is not yet wired. There is no auth, no CORS, and no panic
    recovery.
  contact:
    name: WMS maintainers
  license:
    name: Proprietary

servers:
  - url: http://localhost:8888
    description: Local development server (matches `cmd/main.go`)

tags:
  - name: Health
    description: Liveness probe.
  - name: SKUs
    description: |
      Stock keeping units. Identifiers are Luhn-encoded on the wire and all
      quantities across the API are expressed in the SKU's `base_uom`.
  - name: Packaging Units
    description: |
      Consumable/disposable containers that measure content (`EACH`, `CASE`,
      `PALLET`), forming a self-referencing hierarchy under each SKU.
  - name: Lots
    description: |
      Batches with manufacture and expiry dates. Only `AVAILABLE` lots are
      allocatable, which is what makes this the lever for recall and quarantine.
  - name: Storage Nodes
    description: |
      The `ltree`-backed location hierarchy. `path` is server-materialised and
      rewritten wholesale when a subtree is reparented.
  - name: Inventory Balances
    description: |
      Stock positions keyed on `(node, packaging unit, lot, sealed)` with an
      optimistic-concurrency `version`, plus the low-level ledger primitives used
      to project additions and deductions.
  - name: Inventory Allocations
    description: |
      Reservations of a balance against an outbound order line, tracking both
      allocated and picked quantities.
  - name: Inventory Movements
    description: |
      The immutable, append-only double-entry ledger. Corrections are compensating
      rows, never edits or deletes.
  - name: Inbound Orders
    description: |
      Expected receipts against a purchase order, and their lines.
  - name: Receipts
    description: |
      The physical goods-receipt events that actually increase stock, as distinct
      from the expected inbound order.
  - name: Outbound Orders
    description: |
      Customer orders and their lines, driven through
      `PENDING -> ALLOCATED -> PICKING -> PACKED -> SHIPPED`.
  - name: Handling Units & Shipments
    description: |
      Physical reusable containers and outbound shipments. Note the deliberate
      distinction from packaging units, which are consumable.
  - name: Warehouse Tasks
    description: |
      The operator work queue. No HTTP surface exists for this domain yet.

security: []

paths:
  /api/ping:
    get:
      tags: [Health]
      operationId: ping
      summary: Liveness probe
      description: |
        Returns `{"pong":""}`. The field is populated by `ping` in `cmd/main.go`,
        which currently declares `pong` but never assigns it — the value is always
        empty. Assign `pong = "pong"` to make the probe meaningful.
      x-handler: ping (cmd/main.go:23)
      x-handler-gap: Response value is always the empty string.
      responses:
        "200":
          description: Server is reachable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  pong:
                    type: string
                    example: pong
        "500":
          description: |
            Not reachable. The server process is down, or the listener is bound but
            the `main` goroutine has panicked.

  # ---------------------------------------------------------------- SKUs ----
  /api/v1/skus:
    post:
      tags: [SKUs]
      operationId: createSku
      summary: Create a SKU
      description: |
        Inserts a stock keeping unit. The generated id is returned Luhn-encoded
        (`id * 10 + check_digit`); ids begin at `10000`.
      x-handler: SkuHandler.CreateSKU
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SKUCreate"
      responses:
        "201":
          description: SKU created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SKU"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags: [SKUs]
      operationId: listSkus
      summary: List SKUs
      x-handler: SkuHandler.ListSKUs
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: SKUs ordered by id. Ids are Luhn-encoded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SKU"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [SKUs]
      operationId: searchSkusByName
      summary: Fuzzy-search SKUs by name
      description: |
        Trigram search (`pg_trgm`) ordered by similarity. **No handler exists** —
        `SearchSKUsByName` is generated in `internal/db/skus.sql.go` but nothing
        calls it. Add `SearchSKUs` to `SkuHandler`.
      x-handler: null
      x-handler-gap: Handler and route missing.
      parameters:
        - name: name
          in: query
          required: true
          description: Trigram search term.
          schema:
            type: string
          example: bolt
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 100
            maximum: 500
      responses:
        "200":
          description: Matching SKUs, most similar first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SKU"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/skus/{id}:
    parameters:
      - $ref: "#/components/parameters/LuhnIdPath"
    get:
      tags: [SKUs]
      operationId: getSku
      summary: Get a SKU by id
      x-handler: SkuHandler.GetSKU
      x-handler-gap: |
        The request requires the Luhn-encoded id but the response returns the
        **raw** database id, because `GetSKU` omits the
        `sku.ID*10 + CalculateLuhn(sku.ID)` step that `CreateSKU`, `ListSKUs` and
        `UpdateSKU` all perform. Re-apply the encoding for a consistent contract.
      responses:
        "200":
          description: SKU found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SKU"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [SKUs]
      operationId: updateSku
      summary: Update SKU attributes
      description: Partial update. Omitted (`null`) fields are left untouched.
      x-handler: SkuHandler.UpdateSKU
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SKUUpdate"
      responses:
        "200":
          description: SKU updated. `id` is Luhn-encoded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SKU"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [SKUs]
      operationId: deleteSku
      summary: Delete a SKU
      description: |
        Hard delete. Restricted by `ON DELETE RESTRICT` from lots, balances,
        movements, order lines and tasks — a SKU with history cannot be deleted.
      x-handler: SkuHandler.DeleteSKU
      responses:
        "204":
          description: SKU deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  # ------------------------------------------------------- Packaging Units ---
  /api/v1/skus/{sku_id}/packaging-units:
    parameters:
      - $ref: "#/components/parameters/SkuIdPath"
    post:
      tags: [Packaging Units]
      operationId: createPackagingUnit
      summary: Create a packaging unit for a SKU
      description: |
        `conversion_factor` expresses how many `base_uom` units one container
        holds, and must be exactly `1.0000` when `isBaseUnit` is true
        (`chk_base_unit_factor`). A SKU may have at most one base unit (partial
        unique index). `barcode` is unique across all packaging units.
      x-handler: SkuHandler.CreatePackagingUnit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PackagingUnitCreate"
      responses:
        "201":
          description: Packaging unit created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackagingUnit"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags: [Packaging Units]
      operationId: listPackagingUnitsBySku
      summary: List packaging units of a SKU
      description: Ordered by `conversionFactor` ascending, smallest container first.
      x-handler: SkuHandler.ListPackagingUnitsBySKU
      responses:
        "200":
          description: Packaging units. `SkuID` is Luhn-encoded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PackagingUnit"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/packaging-units/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [Packaging Units]
      operationId: getPackagingUnitById
      summary: Get a packaging unit by id
      x-handler: null
      x-handler-gap: Handler and route missing (`GetPackagingUnitByID` is generated but uncalled).
      responses:
        "200":
          description: Packaging unit found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackagingUnit"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Packaging Units]
      operationId: updatePackagingUnit
      summary: Update a packaging unit
      description: Partial update. Omitted (`null`) fields are left untouched.
      x-handler: null
      x-handler-gap: Handler and route missing (`UpdatePackagingUnit` is generated but uncalled).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PackagingUnitUpdate"
      responses:
        "200":
          description: Packaging unit updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackagingUnit"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Packaging Units]
      operationId: deletePackagingUnit
      summary: Delete a packaging unit
      description: |
        Restricted by `ON DELETE RESTRICT` from balances, movements, order lines
        and tasks.
      x-handler: null
      x-handler-gap: Handler and route missing (`DeletePackagingUnit` is generated but uncalled).
      responses:
        "204":
          description: Packaging unit deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/packaging-units/by-barcode/{barcode}:
    get:
      tags: [Packaging Units]
      operationId: getPackagingUnitByBarcode
      summary: Scan-resolve a packaging unit by barcode
      x-handler: null
      x-handler-gap: Handler and route missing (`GetPackagingUnitByBarcode` is generated but uncalled).
      parameters:
        - name: barcode
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Packaging unit found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackagingUnit"
        "404":
          $ref: "#/components/responses/NotFound"

  # ----------------------------------------------------------------- Lots ---
  /api/v1/skus/{sku_id}/lots:
    parameters:
      - $ref: "#/components/parameters/SkuIdPath"
    post:
      tags: [Lots]
      operationId: createLot
      summary: Create a lot for a SKU
      description: '`(skuId, lotNumber)` is unique. Only meaningful for SKUs with `requiresLotTracking: true`.'
      x-handler: SkuHandler.CreateLot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LotCreate"
      responses:
        "201":
          description: Lot created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lot"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags: [Lots]
      operationId: listLotsBySku
      summary: List lots of a SKU
      description: FEFO order — earliest `expiresAt` first, undated lots last.
      x-handler: SkuHandler.ListLotsBySKU
      responses:
        "200":
          description: Lots. `SkuID` is Luhn-encoded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lot"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/skus/{sku_id}/lots/{lot_number}:
    parameters:
      - $ref: "#/components/parameters/SkuIdPath"
      - name: lot_number
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Lots]
      operationId: getLotByNumber
      summary: Get a lot of a SKU by lot number
      x-handler: null
      x-handler-gap: Handler and route missing (`GetLotBySKUAndNumber` is generated but uncalled).
      responses:
        "200":
          description: Lot found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lot"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/lots/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [Lots]
      operationId: getLotById
      summary: Get a lot by id
      x-handler: null
      x-handler-gap: Handler and route missing (`GetLotByID` is generated but uncalled).
      responses:
        "200":
          description: Lot found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lot"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/lots/{id}/status:
    patch:
      tags: [Lots]
      operationId: updateLotStatus
      summary: Quarantine, expire or recall a lot
      description: |
        `QUARANTINED`, `EXPIRED` and `RECALLED` lots are excluded from
        `FindReservableBalances` (`l.status IS NULL OR l.status = 'AVAILABLE'`),
        so this is the lever for stopping new allocations against a lot. It does
        **not** delete existing balances.
      x-handler: null
      x-handler-gap: Handler and route missing (`UpdateLotStatus` is generated but uncalled).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [Status]
              properties:
                Status:
                  $ref: "#/components/schemas/LotStatus"
      responses:
        "200":
          description: Lot status updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lot"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  # --------------------------------------------------------- Storage Nodes ---
  /api/v1/storage-nodes:
    post:
      tags: [Storage Nodes]
      operationId: createStorageNode
      summary: Create a storage node
      description: |
        Nodes form an `ltree` hierarchy. `CreateStorageNode` is a CTE that inserts
        the row and then derives `path` from the parent's path, so the returned
        node always carries a complete, freshly-materialised `path`. Leave
        `ParentId` null to create a `WAREHOUSE`-level root.
      x-handler: LocationHandler.CreateStorageNode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorageNodeCreate"
      responses:
        "201":
          description: Storage node created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageNode"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags: [Storage Nodes]
      operationId: listDirectChildNodes
      summary: List direct children of a parent node
      description: |
        Defaults to the top-level nodes (`parent_id IS NULL`) when `parent_id` is
        omitted. Note that `ListDirectChildNodes` uses `parent_id = $1`, which does
        **not** match null rows unless the parameter is explicitly NULL — the
        handler passes an invalid `pgtype.Int8` for the root case, so verify this
        behaves as intended.
      x-handler: LocationHandler.ListDirectChildNodes
      parameters:
        - name: parent_id
          in: query
          required: false
          description: Parent node id. Omit for top-level nodes.
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Direct children, ordered by `code` ascending.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StorageNode"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/storage-nodes/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [Storage Nodes]
      operationId: getStorageNode
      summary: Get a storage node by id
      x-handler: LocationHandler.GetStorageNode
      responses:
        "200":
          description: Storage node found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageNode"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Storage Nodes]
      operationId: updateStorageNodeDetails
      summary: Update a storage node's own attributes
      description: |
        Partial update of `code`, `isMovable`, `maxWeightKg`, `maxVolumeCm3` and
        `isActive`. `parentId`, `nodeType` and `path` are **not** editable here —
        use the reparent endpoint to move a node.
      x-handler: LocationHandler.UpdateStorageNodeDetails
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorageNodeUpdate"
      responses:
        "200":
          description: Storage node updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageNode"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Storage Nodes]
      operationId: deleteStorageNode
      summary: Delete a storage node
      description: |
        `ON DELETE RESTRICT` on both `parent_id` and every referencing balance,
        movement and task. A node with children or with stock cannot be deleted.
      x-handler: LocationHandler.DeleteStorageNode
      responses:
        "204":
          description: Storage node deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/storage-nodes/by-code/{code}:
    get:
      tags: [Storage Nodes]
      operationId: getStorageNodeByCode
      summary: Get a storage node by its unique code
      x-handler: LocationHandler.GetStorageNodeByCode
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Storage node found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageNode"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/storage-nodes/{id}/children:
    get:
      tags: [Storage Nodes]
      operationId: listStorageNodeChildren
      summary: List direct children of a node
      description: Alias of `GET /api/v1/storage-nodes` scoped to `{id}`.
      x-handler: LocationHandler.ListDirectChildNodes
      x-handler-gap: Route missing. The handler accepts `root` as a literal path value for the top level.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Direct children, ordered by `code` ascending.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StorageNode"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/storage-nodes/root/children:
    get:
      tags: [Storage Nodes]
      operationId: listRootStorageNodes
      summary: List top-level storage nodes
      x-handler: LocationHandler.ListDirectChildNodes
      x-handler-gap: Route missing.
      responses:
        "200":
          description: Nodes whose `parent_id` is NULL.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StorageNode"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/storage-nodes/{id}/subtree:
    get:
      tags: [Storage Nodes]
      operationId: listStorageNodeSubtree
      summary: List a node and all of its descendants
      description: Uses the `ltree` `<@` ancestor operator against the node's own `path`.
      x-handler: LocationHandler.ListSubtreeNodes
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Subtree, ordered by `path`.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StorageNode"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/storage-nodes/{id}/parent:
    put:
      tags: [Storage Nodes]
      operationId: reparentStorageNode
      summary: Move a node (and its whole subtree) under a new parent
      description: |
        `ReparentStorageNode` rewrites `path` for the node **and every descendant**
        in one statement using `subpath(...)`. The `AND NOT (p.p_path <@ t.t_path)`
        guard rejects cycles. Because the handler currently returns bare `200` with
        no body, consider adding `RecordNodeRelocation` in the same transaction so
        the move is auditable.
      x-handler: LocationHandler.ReparentStorageNode
      x-handler-gap: |
        `ReparentStorageNodeParams` is `{ID, ID_2}` where `ID_2` is the **new
        parent**. The handler only sets `params.ID`, so `ID_2` stays `0` and the
        statement matches no parent. Read `NewParentId` from the body into
        `params.ID_2`.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [NewParentId]
              properties:
                NewParentId:
                  type: integer
                  format: int64
                  description: New parent node id. Must not be the node itself or one of its descendants.
      responses:
        "200":
          description: Subtree reparented. No response body today.
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/storage-nodes/{id}/relocations:
    post:
      tags: [Storage Nodes]
      operationId: recordNodeRelocation
      summary: Record a node relocation in the audit trail
      description: |
        Append-only audit row capturing from/to parent and from/to `ltree` path.
        Call this in the same transaction as the reparent to keep `node_relocations`
        consistent with `storage_nodes`.

        Note that the generated `UpdateStorageNodePath` query (a raw
        `UPDATE storage_nodes SET path = $2`) is deliberately **not** exposed by
        this document. Writing a node's `path` in isolation would desynchronise it
        from every descendant, so it must only ever be reached through the
        reparent statement above.
      x-handler: null
      x-handler-gap: Handler and route missing (`RecordNodeRelocation` is generated but uncalled).
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeRelocationCreate"
      responses:
        "201":
          description: Relocation recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeRelocation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  # ---------------------------------------------------- Inventory Balances ---
  /api/v1/inventory/balances/node/{node_id}:
    get:
      tags: [Inventory Balances]
      operationId: listBalancesByNode
      summary: List every stock position at a node
      description: |
        Joined with the SKU and packaging unit, so each row carries
        `skuUuid`, `skuName` and `unitName` alongside the balance columns.
      x-handler: InventoryHandler.ListBalancesByNode
      parameters:
        - $ref: "#/components/parameters/NodeIdPath"
      responses:
        "200":
          description: Stock positions at the node.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BalanceByNode"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/inventory/balances/reservable:
    get:
      tags: [Inventory Balances]
      operationId: findReservableBalances
      summary: Find balances with enough unreserved stock to allocate
      description: |
        Returns balances where `on_hand - allocated >= on_hand_min`, restricted to
        `AVAILABLE` lots, ordered FEFO then largest `on_hand` first. This is the
        allocation candidate feed — feed `balanceId` from the response into
        `CreateAllocation`.

        `on_hand_min` must be sent as a number or a quoted string, e.g.
        `?on_hand=1` or `?on_hand="1.000"`.
      x-handler: InventoryHandler.FindReservableBalances
      x-handler-gap: |
        The handler passes an **empty** `db.FindReservableBalancesParams{}`, so
        `SkuID`/`PkuID` are `0` and `OnHand` is NULL — the query cannot match
        anything useful. Populate all three from the query string.
      parameters:
        - name: sku_id
          in: query
          required: true
          schema:
            type: integer
            format: int64
        - name: pku_id
          in: query
          required: true
          schema:
            type: integer
            format: int64
        - name: on_hand
          in: query
          required: true
          description: Minimum unreserved quantity, in the SKU's `base_uom`.
          schema:
            $ref: "#/components/schemas/Quantity"
      responses:
        "200":
          description: Reservable balances.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryBalance"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/inventory/balances/lock:
    post:
      tags: [Inventory Balances]
      operationId: lockBalanceForUpdate
      summary: Select a balance row `FOR UPDATE`
      description: |
        Returns the narrow projection needed for a mutation: `id`, `onHand`,
        `packageCount`, `allocated` and `version`. The row lock is only held for
        the life of the enclosing transaction, so this endpoint is only useful
        if it runs inside one — the current design has no unit-of-work layer
        (`Queries.WithTx` is never called).

        `lotId` must be sent explicitly: the query uses
        `lot_id IS NOT DISTINCT FROM $3`, so `null` means "balance with no lot"
        and **will not** match lot-tracked stock.
      x-handler: InventoryHandler.LockBalanceForUpdate
      x-handler-gap: |
        The handler binds the `{id}` path value to `NodeID` and never sets `PkuID`,
        `LotID` or `IsSealed`. The contract below (JSON body, no path param) is what
        `LockBalanceForUpdate` actually needs — rewrite the handler to match.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BalanceLockRequest"
      responses:
        "200":
          description: Locked balance row.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceLock"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/inventory/balances/{id}/allocation:
    patch:
      tags: [Inventory Balances]
      operationId: updateBalanceAllocation
      summary: Increase the reserved quantity on a balance
      description: |
        Adds `allocated` to the balance's reserved quantity, guarded by both the
        optimistic-concurrency `version` and `chk_allocated_le_on_hand`
        (`on_hand - allocated - delta >= 0`). Executes via `:execrows`, so the
        endpoint has **no response body** — a `200` means the row was updated, and
        a `500` means either the version was stale or there was insufficient
        unreserved stock. Read the row with `lockBalanceForUpdate` afterwards if
        you need the new `version`.
      x-handler: InventoryHandler.UpdateBalanceAllocation
      x-handler-gap: |
        The handler writes the sqlc result (an `int64` row count) as the JSON body
        via `shared.WriteJSON`, producing a bare number. Return `204 No Content`
        instead, or re-read the balance and return it.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BalanceAllocationUpdate"
      responses:
        "200":
          description: Balance reserved. Body is currently the affected row count.
          content:
            application/json:
              schema:
                type: integer
                format: int64
                example: 1
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/inventory/balances/project/destination-addition:
    post:
      tags: [Inventory Balances]
      operationId: projectDestinationAddition
      summary: Upsert stock into a destination node
      description: |
        Upserts on `(node_id, pku_id, lot_id, is_sealed)` (`NULLS NOT DISTINCT`),
        adding to `on_hand` and `packageCount` and bumping `version`. This is a
        ledger primitive: pair it with an `InsertMovement` of reason `PUTAWAY` or
        `RECEIVING` in the same transaction so the double-entry record exists.
      x-handler: InventoryHandler.ProjectDestinationAddition
      x-handler-gap: |
        The handler responds with a bare `200` because the query is `:exec`.
        Combine this with `InsertMovement` into a single `POST /movements` call
        rather than exposing the two halves independently.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DestinationAddition"
      responses:
        "200":
          description: Destination balance upserted. No response body.
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/inventory/balances/project/source-deduction:
    post:
      tags: [Inventory Balances]
      operationId: projectSourceDeduction
      summary: Deduct stock from a source balance
      description: |
        Subtracts `on_hand` and `package_count`, guarded by `version`. Executes via
        `:execrows`, so the handler currently responds with a bare row count — a
        `0` means the version was stale.
      x-handler: InventoryHandler.ProjectSourceDeduction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceDeduction"
      responses:
        "200":
          description: Rows updated — `0` indicates a stale `version`.
          content:
            application/json:
              schema:
                type: integer
                format: int64
                example: 1
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

